# Framework plumbing (i18n, blog flags, UI). Client identity is NOT here.
# Edit src/config/site.ts for name, URL, GTM, and Search Console.

site:
  name: Kuroda Autobody
  site: 'https://kurodaautobody.com'
  base: '/'
  trailingSlash: true
  googleSiteVerificationId: ''

# Default SEO metadata
metadata:
  title:
    default: Kuroda Autobody
    template: '%s | Kuroda Autobody'
  description: 'Family-owned collision repair in Waipahu, Oʻahu since 1938. I-CAR Gold Class certified, OEM calibration and a Limited Lifetime Warranty.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Kuroda Autobody
    images: []
    type: website
  twitter:
    handle: ''
    site: ''
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

analytics:
  vendors:
    googleTagManager:
      id: ''
    googleAnalytics:
      id: null

ui:
  theme: 'light'
